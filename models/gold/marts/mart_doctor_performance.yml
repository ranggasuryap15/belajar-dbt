version: 2

models:
  - name: mart_doctor_performance
    description: "Monthly aggregated performance metrics per doctor, including visits, treatments, treatment revenue, and laboratory tests."

    columns:
      - name: mart_doctor_performance_key
        description: "Surrogate key composed of doctor_key, year, and month."
        data_tests:
          - unique
          - not_null

      - name: doctor_key
        description: "Foreign key to dim_doctors."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_doctors')
                field: doctor_key

      - name: doctor_name
        description: "Doctor name from the doctor dimension."
        data_tests:
          - not_null

      - name: specialty
        description: "Doctor medical specialty."
        data_tests:
          - not_null

      - name: year
        description: "Calendar year of the performance metrics."
        data_tests:
          - not_null

      - name: month
        description: "Calendar month (1-12) of the performance metrics."
        data_tests:
          - not_null

      - name: month_name
        description: "Calendar month name of the performance metrics."
        data_tests:
          - not_null

      - name: total_visits
        description: "Total number of visits handled by the doctor in this month."
        data_tests:
          - not_null

      - name: total_treatments
        description: "Total number of treatments handled by the doctor in this month."
        data_tests:
          - not_null

      - name: total_treatment_revenue
        description: "Total treatment revenue generated by the doctor in this month."
        data_tests:
          - not_null

      - name: total_lab_tests
        description: "Total number of laboratory tests associated with the doctor's visits in this month."
        data_tests:
          - not_null
