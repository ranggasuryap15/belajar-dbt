version: 2

models:
  - name: mart_hospital_monthly_trend
    description: "Monthly hospital visit trends with previous-month comparison, Month-over-Month change, and three-month moving average."

    columns:
      - name: hospital_monthly_trend_key
        description: "Surrogate key composed of hospital_key, year, and month."
        data_tests:
          - unique
          - not_null

      - name: hospital_key
        description: "Foreign key to dim_hospitals."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hospitals')
                field: hospital_key

      - name: hospital_name
        description: "Hospital name from the hospital dimension."
        data_tests:
          - not_null

      - name: city
        description: "Hospital city."

      - name: year
        description: "Calendar year of the visit metrics."
        data_tests:
          - not_null

      - name: month
        description: "Calendar month of the visit metrics."
        data_tests:
          - not_null

      - name: month_name
        description: "Calendar month name of the visit metrics."
        data_tests:
          - not_null

      - name: total_visits
        description: "Total number of visits recorded for the hospital in the month."
        data_tests:
          - not_null

      - name: previous_month_visits
        description: "Total visits from the previous calendar month for the same hospital."

      - name: moving_average_3_months
        description: "Three-month moving average of hospital visits, including the current month and the previous two calendar months."

      - name: visit_change
        description: "Difference between current-month visits and previous-month visits."

      - name: visit_change_percentage
        description: "Percentage change in visits compared with the previous calendar month."