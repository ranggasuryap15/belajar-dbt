version: 2

models:
  - name: dim_date
    description: "Date dimension for healthcare analytics."

    columns:
      - name: date_key
        description: "Surrogate date key in YYYYMMDD format."
        data_tests:
          - unique
          - not_null

      - name: full_date
        description: "Full calendar date."
        data_tests:
          - unique
          - not_null

      - name: year
        description: "Calendar year."

      - name: quarter
        description: "Calendar quarter."

      - name: month
        description: "Calendar month number."

      - name: is_weekend
        description: "Indicates whether the date falls on a weekend."