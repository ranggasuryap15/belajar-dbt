
version: 2

models:
  - name: silver_diagnoses
    description: "Cleaned and standardized patient diagnosis records"

    columns:
      - name: diagnosis_id
        description: "Unique identifier for each diagnosis"
        data_tests:
          - not_null
          - unique

      - name: visit_id
        description: "Reference to the patient visit"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_visits')
                field: visit_id

      - name: diagnosis_code
        description: "Diagnosis code"

      - name: diagnosis_name
        description: "Name of the diagnosis"

      - name: icd10_code
        description: "ICD-10 diagnosis classification code"

      - name: is_primary
        description: "Indicates whether the diagnosis is the primary diagnosis"
